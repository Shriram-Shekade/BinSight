[project]
name = "binsight"
version = "0.2.0"
description = "Smart waste-sorting bin demo: zero-shot camera classification with SigLIP2 / CLIP"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "opencv-python",
    "pillow",
    "protobuf",
    "pyyaml",
    "sentencepiece",
    "torch",
    "torchvision",
    "transformers>=4.49",
    "typer",
    "datasets",
    "safetensors",
    "tqdm",
    "matplotlib",
]

[project.scripts]
binsight = "binsight.cli:app"

[dependency-groups]
demo = [
    "gradio>=6.31.0",
]
dev = ["ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/binsight"]

# A plain `pip install` gets the trained head and its settings, so it works without a checkout.
[tool.hatch.build.targets.wheel.force-include]
"config.yaml" = "binsight/config.yaml"
"models/head.safetensors" = "binsight/models/head.safetensors"
"models/head.json" = "binsight/models/head.json"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]
