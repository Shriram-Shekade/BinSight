# BinSight settings. Everything tunable lives here.

# --- model ---------------------------------------------------------------
# Frozen open-source backbone. Override per run with `--model <id>`, or `--model fallback`.
model: google/siglip2-so400m-patch16-256
fallback_model: openai/clip-vit-large-patch14
device: auto            # auto = MPS if available, else CPU. Or: mps | cpu
dtype: auto             # auto = float16 on MPS, float32 on CPU

# Trained classifier head (made by `binsight train`). If the file is missing, or was trained
# on another backbone, BinSight falls back to zero-shot prompts.
head: models/head.safetensors

# --- scoring -------------------------------------------------------------
prompt_template: "This is a photo of {}."
# auto = the threshold `binsight train` picked on validation data to meet max_wrong_sort
# (0.6 in zero-shot mode). A number overrides it.
threshold: auto
threshold_step: 0.05    # change per +/- keypress in the live window
reject_class: other     # top class that always routes to UNSURE
# Zero-shot guard for things the training data has no examples of (hands, faces, empty
# tray, phones): UNSURE if the zero-shot "other" score is at least this. null disables it.
guard: 0.5

# Order matters: it is the class order of the head and of every score output. One
# compartment per class (class name upper-cased), plus UNSURE. Used by zero-shot and the guard.
prompts:
  plastic: [plastic bottle, plastic bag, chip packet wrapper, plastic container, plastic cup]
  paper: [newspaper, cardboard box, sheet of paper, paper bag]
  metal: [aluminium soda can, tin can, aluminium foil, metal bottle cap]
  organic: [banana peel, apple core, food scraps, vegetable peels]
  other:
    - glass bottle
    - battery
    - phone
    - a human hand
    - an empty surface
    - a person's face

# --- training data -------------------------------------------------------
data:
  dir: data               # embeddings and splits (git-ignored)
  seed: 0
  val_fraction: 0.15
  test_fraction: 0.15
  dedupe_cosine: 0.985    # images this similar count as one (copies across datasets)
  augment_views: 2        # extra augmented embeddings per training image
  batch_size: 64
  workers: 6
  # Hugging Face dataset -> {its label: our class}. null drops the label: it is too mixed
  # to say which compartment it belongs in, and a wrong label teaches wrong sorts.
  sources:
    omasteam/waste-garbage-management-dataset:   # MIT, ~19.8k images
      battery: other
      biological: organic
      cardboard: paper
      clothes: other
      glass: other
      metal: metal
      paper: paper
      plastic: plastic
      shoes: other
      trash: null           # mixed non-recyclables; overlaps wrappers we call plastic
    garythung/trashnet:                          # MIT, ~5k images
      cardboard: paper
      glass: other
      metal: metal
      paper: paper
      plastic: plastic
      trash: null
    viola77data/recycling-dataset:               # Apache-2.0, ~3.1k images
      aluminium: metal
      batteries: other
      cardboard: paper
      disposable plates: null   # paper, plastic or foam
      glass: other
      hard plastic: plastic
      paper: paper
      paper towel: null         # used tissue: not recyclable paper, not food
      polystyrene: null         # foam: rarely accepted with plastics
      soft plastics: plastic    # bags and wrappers
      takeaway cups: null       # plastic-lined paper

# --- training ------------------------------------------------------------
train:
  epochs: 40
  batch_size: 256
  label_smoothing: 0.05
  dropout: 0.2
  # Small grid; the best on validation macro-F1 is kept. hidden 0 = linear head.
  hidden: [0, 512]
  lr: [0.001, 0.0003]
  weight_decay: [0.0001, 0.01]
  max_wrong_sort: 0.01    # pick the lowest threshold whose wrong-sort rate on val is <= this

# --- live demo -----------------------------------------------------------
camera: 0               # OpenCV camera index (Continuity Camera can steal 0; try 1)
roi_fraction: 0.6       # tray square side as a fraction of the frame height
display_width: 960      # window video width in px (16:9)

# Auto-trigger: ROI is compared with a background grabbed while the tray is empty.
# Fractions are of ROI pixels that changed by more than the level (0-255 grey).
trigger:
  diff_level: 25          # pixel change that counts as "different from background"
  motion_level: 20        # pixel change between frames that counts as "moving"
  occupied_fraction: 0.04 # above this the tray holds something
  clear_fraction: 0.02    # below this the tray is empty again
  still_fraction: 0.02    # below this between frames the item is still
  still_frames: 10        # consecutive still frames before classifying
  clear_frames: 10        # consecutive empty frames before re-arming
  warmup_frames: 20       # frames skipped (auto-exposure settling) before the background grab
  background_frames: 10   # frames averaged into the background
  adapt_rate: 0.02        # how fast the empty-tray background follows lighting drift
  rearm_still_frames: 45  # item gone but tray never matched background: still this long -> new background
  rearm_skip_frames: 10   # frames skipped before that new background grab

# Compartment colours (hex RGB).
colours:
  PLASTIC: "#3b82f6"
  PAPER: "#f5c542"
  METAL: "#9aa5b1"
  ORGANIC: "#34c759"
  UNSURE: "#ef4444"
