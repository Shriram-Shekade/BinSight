[project]
name = "binsight"
version = "0.1.0"
description = "Smart waste-sorting bin demo: zero-shot camera classification with SigLIP2 / CLIP"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "opencv-python",
    "pillow",
    "protobuf",
    "pyyaml",
    "sentencepiece",
    "torch",
    "torchvision",
    "transformers>=4.49",
    "typer",
]

[project.scripts]
binsight = "binsight.cli:app"

[dependency-groups]
dev = ["ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/binsight"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]
